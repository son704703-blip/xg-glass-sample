name: Build Rokid APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Patch gradle files for Rokid support
        working-directory: ai_assistant
        run: |
          echo "" | base64 -d > settings.gradle.kts
          sed -i -e '/xgglass-core.*:0.3.0"/d' -e 's|xgglass-device-simulator:0.3.0|xgglass-universal:0.3.0|' app/build.gradle.kts

      - name: Build debug APK
        working-directory: ai_assistant
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aiglass-rokid-apk
          path: ai_assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30