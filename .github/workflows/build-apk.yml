name: Build Rokid APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch settings.gradle.kts to add Rokid Maven repo
        working-directory: ai_assistant
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  exclusiveContent {
                      forRepository {
                          maven { url = uri("https://maven.rokid.com/repository/maven-public/") }
                      }
                      filter {
                          includeGroupByRegex("com\\.rokid(\\..+)?")
                      }
                  }
              }
          }

          rootProject.name = "xgGlass-ai-assistant"
          include(":app")
          EOF

      - name: Patch app/build.gradle.kts to use xgglass-universal (Rokid)
        working-directory: ai_assistant
        run: |
          python3 - <<'PY'
          import re
          p = "app/build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          old = '''    implementation("io.github.hkust-spark:xgglass-core:0.3.0")
              implementation("io.github.hkust-spark:xgglass-core-android:0.3.0")
              implementation("io.github.hkust-spark:xgglass-device-simulator:0.3.0")'''
          new = '''    implementation("io.github.hkust-spark:xgglass-universal:0.3.0")'''
          if old in s:
              s = s.replace(old, new)
          else:
              s = re.sub(
                  r'implementation("io.github.hkust-spark:xgglass-(?:core|core-android|device-simulator):0.3.0")
?s*',
                  '', s)
              if "xgglass-universal" not in s:
                  s = s.replace(
                      "androidx.appcompat:appcompat:1.7.1",
                      'androidx.appcompat:appcompat:1.7.1"
    implementation("io.github.hkust-spark:xgglass-universal:0.3.0')
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: Build debug APK
        working-directory: ai_assistant
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aiglass-rokid-apk
          path: ai_assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30